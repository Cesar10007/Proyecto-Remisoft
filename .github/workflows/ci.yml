name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality, audit and Docker build
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4.4
        env:
          MARIADB_ROOT_PASSWORD: ci_root
          MARIADB_DATABASE: remisoft_test
          MARIADB_USER: ci_user
          MARIADB_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
      DB_DATABASE: remisoft_test
      DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/remisoft_test
      JWT_SECRET: ci_secret_para_pruebas
      CARGAR_DEMO: '0'
      ESTABLECIMIENTO_DB_TEST: '1'
      SALON_DB_TEST: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Audit backend dependencies
        working-directory: backend
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Audit frontend dependencies
        working-directory: frontend
        continue-on-error: true
        run: pnpm audit --audit-level=high

      - name: Generate Prisma Client
        working-directory: backend
        run: pnpm run prisma:generate

      - name: Lint backend
        working-directory: backend
        run: pnpm run lint

      - name: Migrate test database
        working-directory: backend
        run: pnpm exec prisma migrate deploy

      - name: Tests backend (unitarios + integracion)
        working-directory: backend
        run: pnpm run test

      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Docker images
        run: docker compose build