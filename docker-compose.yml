services:
  db:
    image: mariadb:11.4.4
    environment:
      # Sin valor por defecto: si falta, docker compose se detiene con el mensaje.
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env (ver .env.example)}"
      MARIADB_DATABASE: remisoft
      MARIADB_USER: remisoft
      MARIADB_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env (ver .env.example)}"
    # Publicado solo en loopback: la base no queda expuesta a la red local.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Publicado solo en loopback: la entrada pública es nginx (puerto 80).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: remisoft
      DB_PASSWORD: "${DB_PASSWORD:?Define DB_PASSWORD en .env (ver .env.example)}"
      DB_DATABASE: remisoft
      DATABASE_URL: "mysql://remisoft:${DB_PASSWORD:?Define DB_PASSWORD en .env (ver .env.example)}@db:3306/remisoft"
      # Los datos demo con contraseñas públicas ya no se cargan por defecto.
      CARGAR_DEMO: ${CARGAR_DEMO:-0}
      # Sin valor por defecto: un secreto publicado permite forjar tokens válidos.
      JWT_SECRET: "${JWT_SECRET:?Define JWT_SECRET en .env con al menos 32 caracteres (ver .env.example)}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      MAILTRAP_HOST: ${MAILTRAP_HOST:-smtp.mailtrap.io}
      MAILTRAP_PORT: ${MAILTRAP_PORT:-2525}
      MAILTRAP_USERNAME: ${MAILTRAP_USERNAME:-}
      MAILTRAP_PASSWORD: ${MAILTRAP_PASSWORD:-}
      MAILTRAP_FROM: ${MAILTRAP_FROM:-no-reply@remisoft.com}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - ./database:/app/database:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-production}

volumes:
  db_data:
